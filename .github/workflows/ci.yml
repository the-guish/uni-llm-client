name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each package runs its checks, HTTP tests and Sonar scan only when it changes.
# A change to the shared tests runs the HTTP tests of every package. A change to
# this workflow runs everything.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.ci == 'true' }}
      python-http: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.ci == 'true' }}
      swift: ${{ steps.filter.outputs.swift == 'true' || steps.filter.outputs.ci == 'true' }}
      swift-http: ${{ steps.filter.outputs.swift == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
      shared: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
      root: ${{ steps.filter.outputs.root == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci:
              - .github/workflows/ci.yml
            shared:
              - tests/**
            python:
              - packages/python/**
            typescript:
              - packages/typescript/**
            swift:
              - packages/swift/**
            root:
              - .github/**
              - tests/**
              - sonar-project.properties

  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build ruff check
      - run: uv run --locked --no-build ruff format --check
      - run: uv run --locked --no-build mypy
      # The package ships copies of the root license files.
      - run: for f in LICENSE NOTICE AUTHORS; do cmp "$f" "../../$f"; done

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build pytest

  python-build:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build

  # The language-agnostic tests against the Python test servers. Their coverage
  # is the only coverage reported for the package.
  python-http:
    needs: changes
    if: needs.changes.outputs.python-http == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build pytest --package python
      - working-directory: packages/python
        run: |
          uv run --locked --no-build coverage combine
          uv run --locked --no-build coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: packages/python/coverage.xml

  shared-lint:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build ruff check
      - run: uv run --locked --no-build ruff format --check
      - run: uv run --locked --no-build mypy

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # The Swift port uses the toolchain the runner images ship.
  swift-lint:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift format lint --recursive --strict Package.swift Sources Tests

  swift-test:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux keeps the port portable; Apple platforms are where most Swift
        # ships.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test

  # The language-agnostic tests against the Swift test servers, built with
  # coverage. Their coverage is the only coverage measured for the package.
  swift-http:
    needs: changes
    if: needs.changes.outputs.swift-http == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - working-directory: packages/swift
        run: swift build --enable-code-coverage
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build pytest --package swift
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/packages/swift/.build/coverage/%p.profraw
      - working-directory: packages/swift
        run: Scripts/coverage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: swift-coverage
          path: packages/swift/coverage.lcov

  # One Sonar project per package, plus one for the workflows and shared tests.
  # Pull requests from forks get no secrets, so they skip the scans.
  sonar-python:
    needs: [changes, python-http]
    if: >-
      needs.changes.outputs.python == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads the history to find new code.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: python-coverage
          path: packages/python
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: packages/python
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-typescript:
    needs: changes
    if: >-
      needs.changes.outputs.typescript == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: packages/typescript
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-root:
    needs: changes
    if: >-
      needs.changes.outputs.root == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The one check to require: it passes when every job passed or was skipped.
  ci-ok:
    if: always()
    needs:
      - changes
      - python-lint
      - python-test
      - python-build
      - python-http
      - shared-lint
      - typescript
      - swift-lint
      - swift-test
      - swift-http
      - sonar-python
      - sonar-typescript
      - sonar-root
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
